{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center text-primary mb-1"><i class="fa-solid fa-right-to-bracket"></i></h3>
                <h4 class="text-center mb-4">Customer Login</h4>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Username or Email</label>
                        <input type="text" name="identifier" class="form-control" value="{{ identifier }}" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
                </p>
                <p class="text-center mt-2 mb-0">
                    <a href="{{ url_for('admin.admin_login') }}" class="text-muted small">
                        <i class="fa-solid fa-user-shield me-1"></i>Administrator login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
