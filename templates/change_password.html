{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="mb-3">
            <a href="{{ url_for('auth.profile') }}" class="text-decoration-none">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Profile
            </a>
        </div>

        <h3 class="mb-4"><i class="fa-solid fa-lock text-primary me-2"></i>Change Password</h3>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.change_password') }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input type="password" name="current_password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password" class="form-control" minlength="8" required>
                        <div class="form-text">At least 8 characters, with a letter and a number.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="8" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fa-solid fa-key me-1"></i> Update Password
                    </button>
                </form>
                <p class="text-muted small mt-3 mb-0">
                    You'll be logged out and asked to sign in again after changing your password.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
