{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="mb-4"><i class="fa-solid fa-box text-primary me-2"></i>Add Product</h4>

                <form method="POST" enctype="multipart/form-data" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Product Name *</label>
                            <input type="text" name="name" class="form-control"
                                   value="{{ form_data.get('name', '') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Brand *</label>
                            <input type="text" name="brand" class="form-control"
                                   value="{{ form_data.get('brand', '') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <input type="text" name="category" class="form-control"
                                   value="{{ form_data.get('category', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Manufacturer</label>
                            <input type="text" name="manufacturer" class="form-control"
                                   value="{{ form_data.get('manufacturer', '') }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3">{{ form_data.get('description', '') }}</textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" step="0.01" min="0" name="price" class="form-control"
                                   value="{{ form_data.get('price', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Manufacture Date</label>
                            <input type="date" name="manufacture_date" class="form-control"
                                   value="{{ form_data.get('manufacture_date', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Expiry Date</label>
                            <input type="date" name="expiry_date" class="form-control"
                                   value="{{ form_data.get('expiry_date', '') }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Product Image</label>
                            <input type="file" name="product_image" class="form-control" accept=".png,.jpg,.jpeg,.webp">
                            <div class="form-text">JPG, PNG, or WEBP. Automatically resized after upload.</div>
                        </div>
                    </div>

                    <div class="alert alert-info mt-4 mb-3 small">
                        <i class="fa-solid fa-barcode me-1"></i>
                        A unique barcode will be generated and assigned automatically when you save.
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Product</button>
                        <a href="{{ url_for('product.list_products') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
