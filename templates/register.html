{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-1"><i class="fa-solid fa-user-plus text-primary"></i></h3>
                <h4 class="text-center mb-4">Create your account</h4>

                <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control"
                               value="{{ form_data.get('full_name', '') }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control"
                               value="{{ form_data.get('username', '') }}"
                               minlength="3" maxlength="30" required>
                        <div class="form-text">3-30 characters: letters, numbers, underscores only.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ form_data.get('email', '') }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone <span class="text-muted">(optional)</span></label>
                        <input type="text" name="phone" class="form-control"
                               value="{{ form_data.get('phone', '') }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" minlength="8" required>
                        <div class="form-text">At least 8 characters, with a letter and a number.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="8" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Create Account</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
