{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="fa-solid fa-triangle-exclamation text-warning" style="font-size: 4rem;"></i>
    <h1 class="mt-3 display-5">{{ code }}</h1>
    <p class="lead text-muted">{{ message }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-2">
        <i class="fa-solid fa-house me-1"></i> Back to Home
    </a>
</div>
{% endblock %}
