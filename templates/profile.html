{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h3 class="mb-4"><i class="fa-solid fa-circle-user text-primary me-2"></i>My Profile</h3>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.profile') }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" value="@{{ user.username }}" disabled readonly>
                        <div class="form-text">Your username can't be changed.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Phone <span class="text-muted">(optional)</span></label>
                        <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h6 class="mb-1"><i class="fa-solid fa-lock me-1"></i> Password</h6>
                    <p class="text-muted small mb-0">Change your account password.</p>
                </div>
                <a href="{{ url_for('auth.change_password') }}" class="btn btn-outline-primary">
                    Change Password
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
