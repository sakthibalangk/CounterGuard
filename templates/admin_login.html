{% extends "base.html" %}
{% block title %}Administrator Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <i class="fa-solid fa-user-shield fa-lg"></i>
                <h5 class="mb-0 mt-2">Administrator Portal</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.admin_login') }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Admin Username or Email</label>
                        <input type="text" name="identifier" class="form-control" value="{{ identifier }}" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">
                        <i class="fa-solid fa-lock me-1"></i> Secure Login
                    </button>
                </form>

                <p class="text-center mt-3 mb-0">
                    <a href="{{ url_for('auth.login') }}" class="text-muted small">Back to customer login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
